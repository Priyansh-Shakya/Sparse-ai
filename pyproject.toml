[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparse-ai"
version = "0.1.0"
description = "Sparse AI Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Yahan sirf wahi rakhein jo har halat me import honi hi honi hain (jaise pydantic, httpx etc.)
    # Agar abhi koi mandatory common package nahi hai, toh is array ko khali [] chhod sakte hain
]

[project.optional-dependencies]
# Graph visualization
graph = [
    "graphviz>=0.21",
]

# Base provider
openai = [
    "openai>=1.0.0",
]

# Standalone providers
gemini = [
    "google-genai",
]
claude = [
    "anthropic",
]

# OpenAI protocol par chalne wale providers
groq = [
    "sparse[openai]",
    "groq",
]
openrouter = [
    "sparse[openai]",
]
huggingface = [
    "sparse[openai]",
    "huggingface-hub",
]

# Sabhi extras ek saath install karne ke liye
all = [
    "sparse[graph,openai,gemini,claude,groq,openrouter,huggingface]",
]